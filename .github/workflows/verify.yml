name: Verify core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4
          cache-read-only: true
      - run: gradle :core:test --no-daemon --console=plain
      - name: Verify JSON schemas offline
        run: |
          python3 -m venv .schema-venv
          .schema-venv/bin/python -m pip install --disable-pip-version-check jsonschema referencing
          .schema-venv/bin/python scripts/verify_schemas.py
