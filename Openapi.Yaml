openapi: 3.0.3
info:
  title: VOID AI Core API (spec phase0)
  version: "0.1.0"
  description: |
    Referência contratual para uma API futura do núcleo VOID.
    Nenhum servidor ou endpoint deste arquivo está em operação. Em particular,
    toolcalls não podem executar ferramentas enquanto não houver identidade autenticada,
    aprovação vinculada e PolicyGate testado.
x-void-contract-status: reference-only
servers: []
paths:
  /api/v1/tasks:
    post:
      summary: Reserved: create task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/task.json
      responses:
        201:
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id:
                    type: string
  /api/v1/tasks/{task_id}:
    get:
      summary: Reserved: get task and state
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Task detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: ./schemas/task.json
                  state:
                    type: string
  /api/v1/tasks/{task_id}/approve:
    post:
      summary: Reserved: record approval
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                approver_id:
                  type: string
                step_ids:
                  type: array
                  items:
                    type: string
                approve:
                  type: boolean
                rationale:
                  type: string
      responses:
        200:
          description: Approval result
  /api/v1/plans/{plan_id}:
    get:
      summary: Reserved: get plan
      parameters:
        - name: plan_id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Plan
          content:
            application/json:
              schema:
                $ref: ./schemas/plan.json
  /api/v1/toolcalls:
    post:
      summary: Reserved: submit tool-call proposal (execution disabled)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./schemas/toolcall.json
      responses:
        501:
          description: Not implemented. A future runtime must evaluate policy before any execution.
  /api/v1/tools:
    get:
      summary: Reserved: list tool descriptors
      responses:
        200:
          description: Tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas/tool.json
  /api/v1/audit:
    get:
      summary: Reserved: query audit logs
      parameters:
        - name: task_id
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
      responses:
        200:
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./schemas/audit.json
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
