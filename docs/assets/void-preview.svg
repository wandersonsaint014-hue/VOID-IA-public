<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Interface proposta do VOID</title><desc id="desc">Prévia conceitual com início, plano e aprovação. Interface escura com acentos verde-menta. Dados fictícios, sem contas conectadas.</desc><rect width="1200" height="750" rx="24" fill="#101B2A"/><g font-family="sans-serif"><text x="35" y="43" fill="#F0F5FC" font-size="24">Um plano visível. Uma decisão de cada vez.</text><text x="35" y="75" fill="#A8B8CD" font-size="15">PRÉVIA CONCEITUAL · DADOS FICTÍCIOS · SEM CONTAS CONECTADAS</text><g transform="translate(35 105)"><rect width="350" height="600" rx="24" fill="#0D1421" stroke="#223747" stroke-width="2"/><text x="24" y="45" fill="#76E1C5" font-size="20" letter-spacing="5">VOID</text><text x="24" y="102" fill="#F0F5FC" font-size="24">O que vamos fazer?</text><text x="24" y="133" fill="#A8B8CD" font-size="13">Você escolhe o objetivo.</text><rect x="20" y="164" width="310" height="190" rx="16" fill="#172334"/><text x="38" y="198" fill="#76E1C5" font-size="12">NOVO PEDIDO</text><text x="38" y="246" fill="#F0F5FC" font-size="21">Envie à Ana:</text><text x="38" y="281" fill="#F0F5FC" font-size="21">Chego às 15h.</text><text x="38" y="329" fill="#A8B8CD" font-size="12">Exemplo fictício, sem envio real</text><rect x="20" y="377" width="310" height="48" rx="12" fill="#76E1C5"/><text x="39" y="407" fill="#0D1421" font-size="16" font-weight="bold">Preparar plano</text><text x="24" y="474" fill="#F0F5FC" font-size="18">Acesso sob seu controle</text><text x="24" y="506" fill="#A8B8CD" font-size="13">Revise antes de qualquer ação.</text><text x="25" y="572" fill="#76E1C5" font-size="13">Início</text><text x="137" y="572" fill="#A8B8CD" font-size="13">Tarefas</text><text x="245" y="572" fill="#A8B8CD" font-size="13">Histórico</text></g><g transform="translate(425 105)"><rect width="350" height="600" rx="24" fill="#0D1421" stroke="#223747" stroke-width="2"/><text x="24" y="45" fill="#76E1C5" font-size="20" letter-spacing="5">VOID</text><text x="24" y="102" fill="#F0F5FC" font-size="24">Veja o plano</text><text x="24" y="133" fill="#A8B8CD" font-size="13">Nada foi enviado.</text><rect x="20" y="164" width="310" height="74" rx="14" fill="#172334"/><text x="38" y="193" fill="#76E1C5" font-size="13">01 · CONFERIR</text><text x="38" y="220" fill="#F0F5FC" font-size="16">Destino e mensagem</text><rect x="20" y="253" width="310" height="74" rx="14" fill="#172334"/><text x="38" y="282" fill="#76E1C5" font-size="13">02 · REVISAR</text><text x="38" y="309" fill="#F0F5FC" font-size="16">Pedir sua aprovação</text><rect x="20" y="342" width="310" height="74" rx="14" fill="#172334"/><text x="38" y="371" fill="#76E1C5" font-size="13">03 · CONFERIR RESULTADO</text><text x="38" y="398" fill="#F0F5FC" font-size="16">Mostrar o que aconteceu</text><rect x="20" y="453" width="310" height="48" rx="12" fill="#76E1C5"/><text x="39" y="483" fill="#0D1421" font-size="16" font-weight="bold">Revisar ação</text><text x="24" y="552" fill="#A8B8CD" font-size="13">Simulação, não execução real</text></g><g transform="translate(815 105)"><rect width="350" height="600" rx="24" fill="#0D1421" stroke="#223747" stroke-width="2"/><text x="24" y="45" fill="#76E1C5" font-size="20" letter-spacing="5">VOID</text><text x="24" y="102" fill="#F0F5FC" font-size="24">Você aprova?</text><text x="24" y="133" fill="#A8B8CD" font-size="13">Confira exatamente esta ação.</text><rect x="20" y="164" width="310" height="230" rx="16" fill="#172334"/><text x="38" y="199" fill="#A8B8CD" font-size="12">DESTINO FICTÍCIO</text><text x="38" y="234" fill="#F0F5FC" font-size="22">Ana</text><text x="38" y="284" fill="#A8B8CD" font-size="12">MENSAGEM</text><text x="38" y="320" fill="#F0F5FC" font-size="22">Chego às 15h.</text><text x="38" y="367" fill="#76E1C5" font-size="12">SIMULAÇÃO · SEM ENVIO REAL</text><rect x="20" y="423" width="310" height="48" rx="12" fill="#76E1C5"/><text x="39" y="453" fill="#0D1421" font-size="16" font-weight="bold">Aprovar simulação</text><rect x="20" y="485" width="310" height="48" rx="12" fill="#223747"/><text x="39" y="515" fill="#F0F5FC" font-size="16">Voltar e revisar</text><text x="24" y="572" fill="#A8B8CD" font-size="12">Aprovação específica, não genérica</text></g></g></svg>